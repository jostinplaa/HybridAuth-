# ===================================================
# HybridAuth - Messages Configuration
# Version: 1.1.0
# ===================================================
# Este archivo contiene TODOS los mensajes del plugin.
# 
# Placeholders disponibles globalmente:
# {player} - Nombre del jugador
# {time} - Tiempo/Duración
# {remaining} - Tiempo restante
# {ip} - Dirección IP
# {attempts} - Intentos restantes
# {min} - Mínimo (usado en validaciones)
# {max} - Máximo (usado en validaciones)
# {admin} - Nombre del administrador
# {action} - Acción realizada
# {version} - Versión del plugin
# {total} - Total (usado en estadísticas)
# {premium} - Usuarios premium
# {cracked} - Usuarios cracked
# {sessions} - Sesiones activas
# 
# Marcadores especiales:
# {no-prefix} - No aplicar el prefijo a este mensaje
# 
# Colores soportados:
# & codes - &a, &b, &c, etc. (Minecraft tradicional)
# #RRGGBB - Colores HEX directos
# &#RRGGBB - Colores HEX para gradientes
# ===================================================

# Prefijo global del plugin
# Se añade automáticamente a TODOS los mensajes (excepto los marcados con {no-prefix})
prefix: "&8[&bHybridAuth&8] &r"

# ===================================================
# ERRORES GENERALES
# ===================================================
error:
  # Error cuando un comando solo puede ser ejecutado por jugadores
  only_players: "&cEste comando solo puede ser ejecutado por jugadores."
  
  # Error de permisos
  no_permission: "&cNo tienes permiso para usar este comando."
  
  # Cuando el jugador intenta hacer algo requiriendo estar autenticado
  not_authenticated: "&cDebes iniciar sesión primero. Usa &e/login <contraseña>"
  
  # Cuando el jugador ya está autenticado
  already_authenticated: "&cYa estás autenticado."
  
  # Cuando el jugador intenta registrarse pero ya tiene cuenta
  already_registered: "&cYa estás registrado. Usa &e/login <contraseña>"
  
  # Cuando el jugador intenta hacer login sin estar registrado
  not_registered: "&cNo estás registrado. Usa &e/register <contraseña> <confirmar>"
  
  # Error genérico de base de datos
  database_error: "&c&lError! &7Hubo un problema con la base de datos. Por favor, contacta a un administrador."
  
  # Error desconocido
  unknown_error: "&cOcurrió un error desconocido. Por favor, intenta de nuevo."
  
  # Cuando un jugador especificado no se encuentra
  player_not_found: "&cEl jugador &e{player} &cno fue encontrado en el servidor."
  
  # Cuando un usuario no está registrado en la base de datos
  user_not_registered: "&cEl usuario &e{player} &cno está registrado en el sistema."
  
  # === ERRORES DE TIPO DE CUENTA (v1.4.0) ===
  # Cuando un premium intenta registrarse
  premium_cannot_register: "&c⚠ Las cuentas premium no necesitan registrarse."
  premium_cannot_register_info: "&7ℹ Tu cuenta usa auto-login automático de Mojang."
  
  # Cuando un premium intenta hacer login
  premium_cannot_login: "&c⚠ Las cuentas premium no necesitan hacer login."
  premium_cannot_login_info: "&7ℹ Tu cuenta se autentica automáticamente."
  
  # Cuando un premium intenta cambiar contraseña
  premium_cannot_changepass: "&c⚠ Las cuentas premium no tienen contraseña local."
  premium_cannot_changepass_info: "&7ℹ Tu contraseña es la de tu cuenta de Mojang."
  
  # Cuando admin intenta desregistrar a un premium
  premium_cannot_unregister: "&c⚠ No puedes desregistrar cuentas premium."
  premium_cannot_unregister_info: "&7ℹ Las cuentas premium están protegidas automáticamente."
  
  # Cuando admin intenta resetear contraseña de premium
  premium_has_no_password: "&c⚠ Las cuentas premium no tienen contraseña local."
  premium_has_no_password_info: "&7ℹ Su contraseña es la de su cuenta de Mojang."

# ===================================================
# ERRORES DE CONTRASEÑA
# ===================================================
password:
  # Contraseña incorrecta al hacer login
  incorrect: "&cContraseña incorrecta. &7Intentos restantes: &e{attempts}"
  
  # Contraseña demasiado corta
  too_short: "&cLa contraseña debe tener al menos &e{min} &ccaracteres."
  
  # Contraseña demasiado larga
  too_long: "&cLa contraseña no puede tener más de &e{max} &ccaracteres."
  
  # Contraseña demasiado débil (no cumple requisitos)
  too_weak: "&cLa contraseña no cumple con los requisitos de seguridad:"
  
  # Las contraseñas de registro/confirmación no coinciden
  must_match: "&cLas contraseñas no coinciden. Por favor, verifica e intenta de nuevo."
  
  # Contraseña es muy común (de lista negra)
  common_password: "&cEsta contraseña es muy común y no es segura. Por favor, elige otra."
  
  # Contraseña contiene el nombre de usuario
  contains_username: "&cLa contraseña no puede contener tu nombre de usuario."
  
  # Cambio de contraseña exitoso
  changed_successfully: "&a&l✔ &a¡Contraseña cambiada correctamente!"
  
  # Contraseña restablecida por admin
  reset_success: "&aContraseña restablecida exitosamente para &e{player}&a."
  
  # Requisitos de contraseña (se muestran cuando too_weak es true)
  requirements:
    length: "  &7• Al menos &e8 caracteres"
    uppercase: "  &7• Al menos &euna letra mayúscula &7(A-Z)"
    lowercase: "  &7• Al menos &euna letra minúscula &7(a-z)"
    number: "  &7• Al menos &eun número &7(0-9)"
    special: "  &7• Al menos &eun carácter especial &7(!@#$%^&*)"
  
  # Etiquetas de fortaleza de contraseña
  strength:
    weak: "&c&lDÉBIL"
    medium: "&e&lMEDIA"
    strong: "&a&lFUERTE"
    very_strong: "&a&l&nMUY FUERTE"

# ===================================================
# RATE LIMITING Y COOLDOWNS
# ===================================================
rate_limit:
  # Cuando el jugador excede el límite de intentos
  exceeded: "&c&l⚠ &cHas excedido el límite de intentos de autenticación."
  
  # Mensaje de espera con tiempo
  wait: "&cPor favor espera &e{time} segundos &cantes de intentar de nuevo."
  
  # Cuando la IP está bloqueada
  blocked: "&c&lBLOQUEADO &7Tu dirección IP ha sido bloqueada temporalmente por seguridad."
  
  # Mensaje de kick por rate limit (multilínea)
  kick_message: |-
    {no-prefix}&c&l━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    &c&lHybridAuth Security
    &c&l━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    
    &7Tu dirección IP está &c&ltemporalmente bloqueada&7.
    
    &7Razón: &fDemasiados intentos fallidos de autenticación
    &7Expira en: &e{remaining} segundos
    
    &7Si crees que esto es un error, contacta
    &7a un administrador del servidor.
    
    &c&l━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ===================================================
# COMANDOS - MENSAJES DE USO
# ===================================================
usage:
  # Uso correcto de comandos
  login: "&cUso correcto: &e/login <contraseña>"
  register: "&cUso correcto: &e/register <contraseña> <confirmar_contraseña>"
  changepassword: "&cUso correcto: &e/changepassword <contraseña_antigua> <contraseña_nueva> <confirmar_nueva>"
  logout: "&cUso correcto: &e/logout"
  unregister: "&cUso correcto: &e/hybridauth unregister <jugador>"
  resetpassword: "&cUso correcto: &e/hybridauth resetpassword <jugador> <nueva_contraseña>"

# ===================================================
# MENSAJES DE ÉXITO
# ===================================================
success:
  # Registro exitoso
  registered: "&a&l✔ &a¡Registrado correctamente! Bienvenido al servidor, &e{player}&a."
  
  # Login exitoso
  logged_in: "&a&l✔ &a¡Has iniciado sesión correctamente!"
  
  # Bienvenida de vuelta
  welcome_back: "&aBienvenido de nuevo, &e{player}&a!"
  
  # Logout exitoso
  logged_out: "&a&l✔ &aHas cerrado sesión correctamente."
  
  # Mensaje de procesamiento
  processing: "&7⏳ &7Procesando tu solicitud, por favor espera..."
  
  # Mensaje de bienvenida adicional
  enjoy: "&7¡Disfruta tu estancia en el servidor!"

# ===================================================
# COMANDOS DE ADMINISTRACIÓN
# ===================================================
admin:
  # Reload de configuración
  reload:
    success: "&a&l✔ &aConfiguración y mensajes recargados correctamente."
    error: "&c&l✖ &cError al recargar la configuración. Revisa la consola para más detalles."
  
  # Desregistrar usuario
  unregister:
    confirm: "&e&l⚠ &eEstás a punto de desregistrar permanentemente a &c{player}&e."
    confirm_instruction: "&eEscribe &a&l/hybridauth confirm &epara confirmar esta acción."
    success: "&a&l✔ &aEl usuario &e{player} &aha sido desregistrado correctamente."
    cancelled: "&7Operación cancelada."
    timeout: "&cEl tiempo de confirmación ha expirado. Operación cancelada."
    console_no_confirmation: "&7La consola no requiere confirmación para comandos."
    no_pending_confirmation: "&cNo tienes ninguna acción pendiente de confirmación."
  
  # Estadísticas del plugin
  stats:
    header: "&8&m━━━━━━━━━━━&r &b&lHybridAuth &r&7Stats &8&m━━━━━━━━━━━"
    version: "&eVersión del Plugin: &7v{version}"
    total_users: "&eTotal de Usuarios: &f{total}"
    premium_users: "&eCuentas Premium: &a{premium}"
    cracked_users: "&eCuentas Cracked: &7{cracked}"
    active_sessions: "&eSesiones Activas: &b{sessions}"
    footer: "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  
  # Menú de ayuda de administración
  help:
    header: "&8&m━━━━━━━━━&r &b&lHybridAuth &r&7Admin &8&m━━━━━━━━━"
    reload: "&7/hybridauth reload &8- &fRecargar configuración y mensajes"
    unregister: "&7/hybridauth unregister <jugador> &8- &fDesregistrar un usuario"
    resetpassword: "&7/hybridauth resetpassword <jugador> <pass> &8- &fRestablecer contraseña"
    stats: "&7/hybridauth stats &8- &fMostrar estadísticas del sistema"
    footer: "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# ===================================================
# AUTENTICACIÓN - PROCESOS
# ===================================================
authentication:
  # Timeout de autenticación
  timeout: "&c&lTiempo Agotado! &7Has sido desconectado por no autenticarte a tiempo."
  
  # Sesión creada
  session_created: "&a&l✔ &7Se ha creado una sesión segura para tu cuenta."
  
  # Sesión expirada
  session_expired: "&e&l⚠ &eTu sesión ha expirado. Por favor, inicia sesión de nuevo."
  
  # Sesión restaurada
  session_resumed: "&a&l✔ &aSesión anterior restaurada. ¡Bienvenido de nuevo!"
  
  # Jugador premium detectado
  premium_detected: "&b&l★ &bJugador Premium detectado. &aInicio de sesión automático activado."
  
  # Jugador de Bedrock Edition
  bedrock_player: "&b&l⛏ &bJugador Bedrock detectado. &7Sistema compatible activado."

# ===================================================
# PREMIUM AUTO-LOGIN - NUEVAS FEATURES
# ===================================================
auth:
  # Se requiere registrarse
  register-required: "&e&l⚠ &eYou must register: &f/register <password> <password>"
  
  # Se requiere login
  login-required: "&e&l⚠ &eYou must login: &f/login <password>"
  
  # Error de verificación premium
  premium-verification-failed: |-
    {no-prefix}&c&l━━━━━━━━━━━━━━━━━━━━━━━━
    &c&lPREMIUM VERIFICATION FAILED
    &c&l━━━━━━━━━━━━━━━━━━━━━━━━
    
    &7Could not verify your premium status.
    &7Please try reconnecting.
    
    &7If the problem persists, contact an admin.
    &c&l━━━━━━━━━━━━━━━━━━━━━━━━
  
  # Títulos
  welcome-title: "&a&l✔ WELCOME"
  premium-auto-registered: "&7Premium account registered"
  welcome-back-title: "&a&lWELCOME BACK"
  premium-auto-login: "&7Auto-logged as premium"
  
  # Migración de cuenta
  migration:
    success: |-
      &a&l✔ &aAccount upgraded to PREMIUM!
      &7
      &7From now on:
      &a  ✔ Auto-login (no password needed)
      &a  ✔ Protected by Mojang
      &a  ✔ Works on all Java servers
      &7
      &eReconnect to activate changes.
    
    failed: "&c&l✖ &cFailed to upgrade account. Contact an admin."
    not_premium: "&c&l✖ &cYou are not a premium player!"
    wrong_password: "&c&l✖ &cIncorrect password!"
    usage: "&cUsage: &e/hybridauth migrate <your_password>"

# ===================================================
# TÍTULOS Y SUBTÍTULOS
# Estos aparecen en pantalla grande
# ===================================================
titles:
  # Título cuando se requiere login
  login_required:
    title: "&c&lAUTENTICACIÓN REQUERIDA"
    subtitle: "&7Usa &e/login <contraseña>"
  
  # Título cuando se requiere registro
  register_required:
    title: "&b&lREGISTRO REQUERIDO"
    subtitle: "&7Usa &e/register <contraseña> <confirmar>"
  
  # Título de login exitoso
  login_success:
    title: "&a&l✔ BIENVENIDO"
    subtitle: "&7Has iniciado sesión correctamente"
  
  # Título de registro exitoso
  register_success:
    title: "&b&l✔ REGISTRADO"
    subtitle: "&7¡Disfruta del servidor!"

# ===================================================
# SEGURIDAD - LOGS Y ALERTAS
# Mensajes para administradores sobre eventos de seguridad
# ===================================================
security:
  # IP sospechosa detectada
  suspicious_ip: "&c&l[ALERTA SEGURIDAD] &7IP sospechosa detectada para el jugador &e{player}"
  
  # Múltiples sesiones detectadas
  multiple_sessions: "&e&l[AVISO] &7Se detectaron múltiples sesiones para &e{player}"
  
  # Ataque de fuerza bruta
  brute_force_detected: "&c&l[ALERTA CRÍTICA] &7Posible ataque de fuerza bruta desde IP &e{ip}"
  
  # Acción administrativa realizada
  admin_action: "&b&l[ADMIN] &7{admin} &fha ejecutado: &e{action}"

# ===================================================
# PLACEHOLDERS ESPECIALES
# Mensajes cortos para estados y acciones
# ===================================================
placeholders:
  loading: "&7⏳ Cargando..."
  processing: "&7⏳ Procesando..."
  done: "&a✔ Completado"
  error: "&c✖ Error"
  arrow: "&8» &7"
  separator: "&8&m━━━━━━━━━━━━━━━━━━━━━━━━"

# ===================================================
# MENSAJES DE ACTION BAR
# Estos aparecen encima de la hotbar
# ===================================================
actionbar:
  # Durante proceso de autenticación
  authenticating: "&7⏳ &eAutenticando..."
  
  # Éxito
  success: "&a&l✔ &aAutenticación exitosa"
  
  # Error
  error: "&c&l✖ &cError de autenticación"
  
  # Esperando
  waiting: "&7⏱ Esperando autenticación... &e{time}s"

# ===================================================
# MENSAJES DE SONIDO (Opcional - para referencia)
# Estos no se muestran, pero documentan qué sonidos usar
# ===================================================
# sounds:
#   login_success: ENTITY_PLAYER_LEVELUP
#   login_fail: BLOCK_ANVIL_LAND
#   register_success: UI_TOAST_CHALLENGE_COMPLETE
#   error: BLOCK_NOTE_BLOCK_BASS
#   click: UI_BUTTON_CLICK

# ===================================================
# CAPTCHA SYSTEM
# ===================================================
captcha:
  # Prompt multilínea
  prompt: |-
    {no-prefix}
    &c&l╔════════════════════════════════════╗
    &c&l║   ⚠ VERIFICATION REQUIRED ⚠      ║
    &c&l╠════════════════════════════════════╣
    &7
    &7  Please solve this simple math problem
    &7  to verify you're not a bot:
    &7
    &e&l     {question}
    &7
    &7  Type your answer in chat
    &7  You have &c30 seconds
    &7  Attempts remaining: &a{attempts}
    &7
    &8  Reason: {reason}
    &7
    &c&l╚════════════════════════════════════╝
  
  invalid_number: "&c&l✖ &cPlease enter a valid number"
  
  success: |-
    {no-prefix}
    &a&l✔ VERIFICATION SUCCESSFUL
    &7Thank you for verifying!
  
  failed: |-
    {no-prefix}
    &c&l✖ INCORRECT ANSWER
    &7Please try again
    &7Attempts remaining: &e{attempts}
    &7Question: &e&l{question}
  
  timeout_kick: |-
    {no-prefix}&c&l⚠ VERIFICATION TIMEOUT ⚠
    
    &7You failed to complete the verification
    &7in time. Please try again.
  
  failed_kick: |-
    {no-prefix}&c&l⚠ VERIFICATION FAILED ⚠
    
    &7You failed to solve the verification
    &7challenge. Please try again later.
  
  pending: "&e&l⚠ &ePlease solve the captcha first before logging in"
  solve_first: "&c&l✖ &cYou must complete the verification challenge first"

# ===================================================
# SECURITY COMMANDS
# ===================================================
security:
  no_permission: "&c&l✖ &cNo tienes permiso para usar este comando."
  
  # Blacklist Add
  blacklist:
    add:
      usage: |-
        &c&l✖ &cUso: &f/security blacklist add <ip> [duration] [reason]
        &7Duración: &fpermanent &7o tiempo en segundos (ej: &f3600&7)
        &7Ejemplo: &f/security blacklist add 123.45.67.89 3600 Spam
      
      invalid_ip: |-
        &c&l✖ &cFormato de IP inválido: &f{ip}
        &7Ejemplo: &f123.45.67.89
      
      already_blocked: |-
        &e&l⚠ &eEsta IP ya está en la blacklist
        &7Usa &f/security blacklist info {ip} &7para ver detalles
      
      invalid_duration: |-
        &c&l✖ &cDuración inválida: &f{duration}
        &7Usa &fpermanent &7o un número en segundos
      
      duration_zero: "&c&l✖ &cLa duración debe ser mayor a 0"
      
      success_permanent: |-
        {no-prefix}
        &4&l✔ IP BLOQUEADA PERMANENTEMENTE
        &7IP: &f{ip}
        &7Razón: &f{reason}
        &7Bloqueada por: &f{blocked_by}
      
      success_temporary: |-
        {no-prefix}
        &6&l✔ IP BLOQUEADA TEMPORALMENTE
        &7IP: &f{ip}
        &7Duración: &f{duration}
        &7Razón: &f{reason}
        &7Bloqueada por: &f{blocked_by}
      
      players_kicked: "&7Jugadores kickeados: &f{count}"
    
    # Blacklist Remove
    remove:
      usage: "&c&l✖ &cUso: &f/security blacklist remove <ip>"
      
      success: |-
        {no-prefix}
        &a&l✔ IP DESBLOQUEADA
        &7IP: &f{ip}
        &7Desbloqueada por: &f{unblocked_by}
      
      not_found: "&c&l✖ &cEsta IP no está en la blacklist"
    
    # Blacklist List
    list:
      empty: "&a&l✔ &aNo hay IPs en la blacklist"
      
      invalid_page: "&c&l✖ &cPágina inválida. Total: &f{total_pages}"
      
      header: "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n&4&l  IP BLACKLIST &7(Página {page}/{total_pages})\n&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      entry_permanent: |-
        &7{index}. &4[PERM] &f{ip}
           &7Razón: &f{reason}
           &7Por: &f{blocked_by}
      
      entry_temporary: |-
        &7{index}. &6[TEMP] &f{ip}
           &7Razón: &f{reason}
           &7Por: &f{blocked_by}
           &7Expira en: &e{time_remaining}
      
      footer: |-
        &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        &7Total de IPs bloqueadas: &f{total}
      
      next_page: "&7Siguiente página: &f/security blacklist list {next_page}"
    
    # Blacklist Info
    info:
      usage: "&c&l✖ &cUso: &f/security blacklist info <ip>"
      
      not_found: "&c&l✖ &cEsta IP no está en la blacklist"
      
      display: |-
        &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        &4&l  INFORMACIÓN DE BLACKLIST
        &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        &7IP: &f{ip}
        &7Tipo: {type}
        &7Razón: &f{reason}
        &7Bloqueada por: &f{blocked_by}
        &7Bloqueada el: &f{blocked_at}
        {expiry_info}
        
        &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      type_permanent: "&4&lPERMANENTE"
      type_temporary: "&6&lTEMPORAL"
      
      expiry_lines: |-
        &7Expira el: &f{expires_at}
        &7Tiempo restante: &e{time_remaining}
    
    # Blacklist Cleanup
    cleanup:
      processing: "&e&l⏳ &eLimpiando entradas expiradas..."
      
      success: |-
        &a&l✔ &aLimpieza completada
        &7Entradas removidas: &f{removed}
        &7Entradas restantes: &f{remaining}
  
  # Stats
  stats:
    header: "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n&4&l  ESTADÍSTICAS DE SEGURIDAD\n&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    
    total_blocked: "&7Total IPs bloqueadas: &f{total}"
    permanent_count: "&7  &4● &7Permanentes: &f{permanent}"
    temporary_count: "&7  &6● &7Temporales: &f{temporary}"
    
    footer: "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  
  # Help
  help:
    header: "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n&4&l  COMANDOS DE SEGURIDAD\n&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    
    add: |-
      &7/security blacklist add <ip> [duration] [reason]
        &8→ &fBloquear una IP
    
    remove: |-
      &7/security blacklist remove <ip>
        &8→ &fDesbloquear una IP
    
    list: |-
      &7/security blacklist list [page]
        &8→ &fListar IPs bloqueadas
    
    info: |-
      &7/security blacklist info <ip>
        &8→ &fVer información de una IP
    
    cleanup: |-
      &7/security blacklist cleanup
        &8→ &fLimpiar entradas expiradas
    
    stats: |-
      &7/security stats
        &8→ &fEstadísticas de seguridad
    
    footer: "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  
  # Kick Messages
  blacklist_kick: |-
    {no-prefix}&4&l╔════════════════════════════════════╗
    &4&l║    ⚠  IP BLACKLISTED  ⚠           ║
    &4&l╠════════════════════════════════════╣
    &c
    &c  Your IP address has been blocked
    &c  from accessing this server.
    &7
    &7  IP: &f{ip}
    &7  Reason: &c{reason}
    &7  Blocked by: &f{blocked_by}
    &7  Blocked at: &f{blocked_at}
    &7
    {duration_info}
    &7
    &7  If you believe this is an error,
    &7  contact a server administrator.
    &7
    &4&l╚════════════════════════════════════╝
  
  blacklist_duration_permanent: "&4&l  Duration: PERMANENT"
  blacklist_duration_temporary: |-
    &e  Expires: &f{expires_at}
    &e  Time remaining: &f{time_remaining}
  
  impostor_kick: |-
    {no-prefix}&4&l╔════════════════════════════════════╗
    &4&l║      ⚠  IMPOSTOR DETECTED  ⚠      ║
    &4&l╠════════════════════════════════════╣
    &c
    &c  This account belongs to another
    &c  Mojang account.
    &7
    &7  Account: &f{username}
    &7  Expected UUID: &a{expected_uuid}
    &7  Your UUID:     &c{actual_uuid}
    &7
    &4&l║ Attempting to use stolen accounts    ║
    &4&l║ will result in a PERMANENT BAN.      ║
    &4&l╚════════════════════════════════════╝

